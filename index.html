<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Drishti | Professional Education Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .section { display: none; padding: 20px; }
        .active { display: block; }
        .ai-search-container { padding: 20px; background: #f4f4f4; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Divya Drishti AI</div>
    </header>

    <!-- Global AI Search -->
    <div class="ai-search-container">
        <input type="text" id="aiSearch" placeholder="Divya Drishti se puchein...">
        <button onclick="runAISearch()">Search with AI</button>
    </div>

    <!-- Navigation Tabs -->
    <nav>
        <button onclick="showSection('home')">Home</button>
        <button onclick="showSection('govt')">Govt Exams</button>
        <button onclick="showSection('cbse')">CBSE Updates</button>
        <button onclick="showSection('news')">News Feed</button>
    </nav>

    <!-- Home Section -->
    <div id="home" class="section active">
        <h1>Welcome to Divya Drishti</h1>
        <p>Aapka AI-Powered Education aur News Portal.</p>
    </div>

    <!-- Govt Exams Section -->
    <div id="govt" class="section">
        <h2>Govt Exam Notifications</h2>
        <input type="text" placeholder="Search Govt Exams...">
    </div>

    <!-- CBSE Section -->
    <div id="cbse" class="section">
        <h2>CBSE Board Updates</h2>
        <input type="text" placeholder="Search CBSE News...">
    </div>

    <!-- News Feed Section -->
    <div id="news" class="section">
        <h2>Divya Drishti News Feed</h2>
        <div id="news-container">
            <!-- Infinite Scroll Content will load here -->
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function runAISearch() {
            alert("AI Search Feature coming soon!");
        }
    </script>
</body>
</html>
