<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Drishti | Revolution in Ed-Tech Media</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-eye"></i> Divya Drishti
        </div>
        
        <div class="search-container">
            <input type="text" id="ai-search-input" placeholder="Ask Divya Drishti (e.g., 'NDA admit card')...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="nav-links">
            <button class="nav-btn active" data-target="home-section">Home</button>
            <button class="nav-btn" data-target="govt-section">Govt Exams</button>
            <button class="nav-btn" data-target="cbse-section">CBSE</button>
        </div>
    </nav>

    <main class="app-container">
        
        <section id="home-section" class="view-section active">
            <h2>Trending Updates</h2>
            <div class="news-grid" id="home-grid">
                </div>
            <div class="loader" id="home-loader">Loading more updates... <i class="fa-solid fa-spinner fa-spin"></i></div>
        </section>

        <section id="govt-section" class="view-section">
            <h2>Government Exams</h2>
            <div class="news-grid" id="govt-grid"></div>
            <div class="loader" id="govt-loader">Loading more updates... <i class="fa-solid fa-spinner fa-spin"></i></div>
        </section>

        <section id="cbse-section" class="view-section">
            <h2>CBSE Board Updates</h2>
            <div class="news-grid" id="cbse-grid"></div>
            <div class="loader" id="cbse-loader">Loading more updates... <i class="fa-solid fa-spinner fa-spin"></i></div>
        </section>

    </main>

    <div id="ai-tutor-window" class="hidden">
        <div class="tutor-header">
            <h3><i class="fa-solid fa-robot"></i> Divya Drishti Tutor</h3>
            <button id="close-tutor"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="tutor-body" id="tutor-response">
            </div>
    </div>

    <script src="script.js?v=final"></script>
</body>
</html>
