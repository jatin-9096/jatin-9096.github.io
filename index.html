<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Drishti | The Ed-Tech Media House</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-eye"></i> Divya Drishti
        </div>
        <div class="search-container">
            <i class="fa-solid fa-robot ai-icon"></i>
            <input type="text" id="aiSearch" placeholder="Ask AI: Try 'NDA eligibility' or 'PCM syllabus'...">
        </div>
        <div class="nav-links">
            <button class="nav-btn active" data-target="home"><i class="fa-solid fa-house"></i> Home</button>
            <button class="nav-btn" data-target="govt-exams"><i class="fa-solid fa-shield-halved"></i> Govt Exams</button>
            <button class="nav-btn" data-target="cbse"><i class="fa-solid fa-book"></i> CBSE & PCM</button>
        </div>
    </nav>

    <main class="content-wrapper">
        
        <section id="home" class="spa-section active">
            <div class="section-header">
                <h2><i class="fa-solid fa-fire"></i> Trending Updates</h2>
                <p>Scroll infinitely for the latest ed-tech and defense news.</p>
            </div>
            <div class="feed-grid" id="newsFeed">
                </div>
            <div class="loader" id="loader">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading more content...
            </div>
        </section>

        <section id="govt-exams" class="spa-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-jet-fighter"></i> Defense & Govt Exams</h2>
            </div>
            <div class="feed-grid" id="govtFeed">
                </div>
        </section>

        <section id="cbse" class="spa-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-atom"></i> CBSE Board & Academics</h2>
            </div>
            <div class="feed-grid" id="cbseFeed">
                </div>
        </section>

    </main>

    <div class="ai-tutor-fab" id="tutorBtn">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
    </div>

    <script src="script.js"></script>
</body>
</html>
