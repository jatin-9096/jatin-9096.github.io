<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NewsSync India</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F6F9FC;color:#425466;font-size:16px}
header{background:#0A2540;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#635BFF;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,91,255,.6)}70%{box-shadow:0 0 0 8px rgba(99,91,255,0)}100%{box-shadow:0 0 0 0 rgba(99,91,255,0)}}
.brand-name{color:#fff;font-weight:800;font-size:1.2rem}
.live-tag{background:rgba(99,91,255,.2);color:#635BFF;font-size:.6rem;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:4px;border:1px solid rgba(99,91,255,.4)}
#last-updated{color:rgba(255,255,255,.5);font-size:.75rem}
main{max-width:1200px;margin:auto;padding:32px 16px}
.section{margin-bottom:48px}
.section-header{border-bottom:2px solid #E8EFF5;padding-bottom:12px;margin-bottom:24px}
.section-title{font-size:1.3rem;font-weight:800;color:#0A2540}
.section-sub{font-size:.78rem;color:#8898AA;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.card{background:#fff;border-radius:12px;border:1px solid #E8EFF5;box-shadow:0 2px 8px rgba(10,37,64,.07);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(99,91,255,.15)}
.card-img{width:100%;height:170px;object-fit:cover;background:#F6F9FC}
.card-body{padding:16px 18px 20px;flex:1;display:flex;flex-direction:column;gap:8px}
.card-source{font-size:.7rem;font-weight:700;color:#635BFF;text-transform:uppercase;letter-spacing:.8px}
.card-title{font-size:.95rem;font-weight:700;color:#0A2540;line-height:1.4}
.card-desc{font-size:.82rem;color:#425466;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-link{margin-top:auto;font-size:.78rem;font-weight:600;color:#635BFF}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,#E8EFF5 25%,#F0F4F8 50%,#E8EFF5 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;border-radius:6px}
.skel-card{background:#fff;border-radius:12px;border:1px solid #E8EFF5;overflow:hidden}
.skel-img{height:170px;width:100%;border-radius:0}
.skel-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.skel-line{height:12px}
.w30{width:30%}.w60{width:60%}.w80{width:80%}.w100{width:100%}.h18{height:18px}
.error-box{grid-column:1/-1;text-align:center;padding:40px 20px;background:#fff;border-radius:12px;border:1px dashed #E8EFF5}
.error-box .icon{font-size:2.5rem;margin-bottom:12px}
.error-box p{color:#8898AA;font-size:.9rem;margin-top:8px}
footer{background:#0A2540;color:rgba(255,255,255,.5);text-align:center;padding:20px;font-size:.78rem}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <span class="brand-name">NewsSync</span>
    <span class="live-tag">LIVE</span>
  </div>
  <span id="last-updated">Loading…</span>
</header>

<main>
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">🇮🇳 India Top News</h2>
      <p class="section-sub">Latest headlines · Auto-refresh every 10 min</p>
    </div>
    <div class="grid" id="news-grid"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">📚 Exam &amp; Board Alerts</h2>
      <p class="section-sub">CBSE · NDA · CUET · UPSC · Latest Notifications</p>
    </div>
    <div class="grid" id="exam-grid"></div>
  </section>
</main>

<footer>© 2025 NewsSync · Powered by GNews API · For informational purposes only</footer>

<script>
const API_KEY = '41f9ca60c9c4feea049876ff25827052';
const BASE    = 'https://gnews.io/api/v4';
const PLACEHOLDER = 'https://placehold.co/600x340/EEF0FF/635BFF?text=NewsSync';

// Har 10 min mein sirf 2 requests — din mein 288 requests max
// GNews free limit: 100/day → isliye 30 min interval safe hai
const INTERVAL = 30 * 60 * 1000; // 30 minutes

function skeletons(n=6){
  return Array.from({length:n},()=>`
    <div class="skel-card">
      <div class="sk skel-img"></div>
      <div class="skel-body">
        <div class="sk skel-line w30"></div>
        <div class="sk skel-line h18 w80"></div>
        <div class="sk skel-line h18 w60"></div>
        <div class="sk skel-line w100"></div>
        <div class="sk skel-line w100"></div>
        <div class="sk skel-line w30"></div>
      </div>
    </div>`).join('');
}

function timeAgo(d){
  if(!d) return '';
  const m=Math.floor((Date.now()-new Date(d))/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function buildCard(a){
  const img = a.image || PLACEHOLDER;
  const desc = (a.description||'No description available.').slice(0,160)+'…';
  const src  = a.source?.name || 'News';
  return `
    <a class="card" href="${a.url}" target="_blank" rel="noopener">
      <img class="card-img" src="${img}" alt="${a.title}" loading="lazy"
           onerror="this.src='${PLACEHOLDER}'"/>
      <div class="card-body">
        <span class="card-source">${src} · ${timeAgo(a.publishedAt)}</span>
        <p class="card-title">${a.title}</p>
        <p class="card-desc">${desc}</p>
        <span class="card-link">Read more →</span>
      </div>
    </a>`;
}

function errBox(msg){
  return `<div class="error-box">
    <div class="icon">📡</div>
    <p>${msg}</p>
  </div>`;
}

async function loadNews(){
  const grid = document.getElementById('news-grid');
  try{
    const url = `${BASE}/top-headlines?country=in&lang=en&category=general&max=9&apikey=${API_KEY}`;
    const res  = await fetch(url);
    const data = await res.json();
    if(!data.articles?.length){ grid.innerHTML=errBox('No headlines found.'); return; }
    grid.innerHTML = data.articles.map(buildCard).join('');
  }catch(e){
    grid.innerHTML = errBox('Could not load news. Check internet & try again.');
  }
}

async function loadExams(){
  const grid = document.getElementById('exam-grid');
  try{
    const q   = encodeURIComponent('"CBSE" OR "NDA" OR "CUET" OR "UPSC"');
    const url = `${BASE}/search?q=${q}&lang=en&country=in&max=9&sortby=publishedAt&apikey=${API_KEY}`;
    const res  = await fetch(url);
    const data = await res.json();
    if(!data.articles?.length){ grid.innerHTML=errBox('No exam alerts found.'); return; }
    grid.innerHTML = data.articles.map(buildCard).join('');
  }catch(e){
    grid.innerHTML = errBox('Could not load exam news. Try again later.');
  }
}

function updateTime(){
  document.getElementById('last-updated').textContent =
    'Updated: '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
}

async function syncAll(){
  await Promise.allSettled([loadNews(), loadExams()]);
  updateTime();
}

// Init
document.getElementById('news-grid').innerHTML = skeletons(6);
document.getElementById('exam-grid').innerHTML  = skeletons(6);

syncAll();
setInterval(syncAll, INTERVAL);
window.addEventListener('online', syncAll);
</script>
</body>
</html>
