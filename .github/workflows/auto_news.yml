name: Auto 5-Min News Sync

on:
  schedule:
    - cron: '*/5 * * * *' # SYSTEM KO HAR 5 MINUTE MEIN AUTOMATIC CHALANE KE LIYE
  workflow_dispatch: # Emergency manual trigger button ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install feedparser

    - name: Run news scraper
      run: python fetch_news.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-synced 100 news articles & trending topics" && git push)
        
