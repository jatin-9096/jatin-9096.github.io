name: Auto Update News

on:
  schedule:
    - cron: '0 */2 * * *' # Yeh har 2 ghante mein automatic chalega
  workflow_dispatch: # Isse aap manually bhi jab chahein chala sakte hain

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python: '3.x'

    - name: Install dependencies
      run: |
        pip install feedparser

    - name: Run news scraper
      run: python fetch_news.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated news" && git push)
        
